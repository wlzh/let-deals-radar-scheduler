name: Automatic deal refresh
run-name: ${{ inputs.mode == 'auto' && 'Daily refresh' || '5m probe' }} after ${{ inputs.parent_run_id || 'operator' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe waits 5 minutes; auto targets daily 05:00 Beijing time'
        type: choice
        options: [probe, auto]
        default: probe
      parent_run_id:
        description: 'Automatic continuation identifier; leave empty when starting a chain'
        type: string
        default: ''
      scheduled_at:
        description: 'UTC target slot, computed by tools.controller.schedule_inputs'
        type: string
        default: ''
      timer_hours:
        description: 'Whole hours to wait server-side (0-23), computed with target slot'
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: scheduled-deal-refresh
  cancel-in-progress: false

jobs:
  timer:
    if: ${{ inputs.mode == 'probe' || inputs.mode == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    environment:
      name: ${{ inputs.mode == 'auto' && format('refresh-slot-{0}h', inputs.timer_hours) || 'refresh-delay-5m' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify minimum server-side delay
        env:
          GH_TOKEN: ${{ github.token }}
          TIMER_MODE: ${{ inputs.mode }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
          TIMER_HOURS: ${{ inputs.timer_hours }}
        run: python3 tools/controller.py check-delay

  refresh:
    needs: timer
    permissions:
      contents: write
    uses: wlzh/let-deals-radar/.github/workflows/update.yml@main
    with:
      target_repository: wlzh/let-deals-radar
      with_replies: true
      recent_days: '90'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REPO_PUSH_KEY: ${{ secrets.LDR_REPO_PUSH_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TARGETS: ${{ secrets.TELEGRAM_TARGETS }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}

  finalize:
    needs: [timer, refresh]
    if: ${{ always() && !cancelled() && needs.timer.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test continuation controller
        id: tests
        run: python3 -m unittest discover -s tests -v
      - name: Record verified success
        id: record
        if: ${{ needs.refresh.result == 'success' }}
        env:
          REFRESHED_SHA: ${{ needs.refresh.outputs.refreshed_sha }}
          TIMER_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          sha = os.environ['REFRESHED_SHA']
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha):
              raise SystemExit('Missing verified original-repository revision')
          record = {
              'completed_at': datetime.now(timezone.utc).isoformat(),
              'source_repository': 'wlzh/let-deals-radar',
              'source_revision': sha,
              'timer_mode': os.environ['TIMER_MODE'],
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('last-success.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Queue next daily run exactly once
        id: queue
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/controller.py queue-next
      - name: Persist success and continuation audit
        if: ${{ !cancelled() && (steps.record.outcome == 'success' || steps.queue.outcome == 'success') }}
        run: |
          if [ -f last-success.json ]; then git add last-success.json; fi
          if [ -f .next-run.json ]; then git add .next-run.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'chore: record refresh and daily continuation'
          git pull --rebase origin main
          git push origin HEAD:main

  alert:
    needs: [timer, refresh, finalize]
    if: ${{ always() && !cancelled() && (needs.timer.result == 'failure' || needs.refresh.result == 'failure' || needs.finalize.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wlzh/let-deals-radar
          ref: main
          persist-credentials: false
      - name: Alert refresh, timer or continuation failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          REFRESH_STATUS: failure
          FAILURE_STAGE: timer=${{ needs.timer.result }}; refresh=${{ needs.refresh.result }}; continuation=${{ needs.finalize.result }}
        run: python3 -m tools.telegram_notify
